<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite de Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #5f7147;
    --verde-escuro: #4a5937;
    --papel: #f4f3ef;
    --texto: #3f4a32;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--papel);
    color: var(--texto);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* textura de papel (usada nas laterais e na segunda tela) */
  .papel {
    background-color: var(--papel);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.35  0 0 0 0 0.32  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .tela {
    position: fixed;
    inset: 0;
    transition: opacity .9s ease, transform 1.1s ease, visibility 0s linear 1.1s;
  }
  .tela.ativa { visibility: visible; transition: opacity .9s ease, transform 1.1s ease; }

  /* ---------- TELA 1: ENVELOPE ---------- */
  #tela-envelope {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .envelope {
    position: relative;
    height: 100vh;
    height: 100dvh;
    aspect-ratio: 1080 / 1920;
    flex: none;
    background: url("__ENVELOPE__") center / 100% 100% no-repeat;
    box-shadow: 0 0 60px rgba(0,0,0,.05);
  }
  /* área clicável exatamente sobre o selo (coordenadas relativas à imagem 1080x1920) */
  .selo {
    position: absolute;
    left: 39.3%;
    top: 55.7%;
    width: 24.4%;
    aspect-ratio: 1;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    outline: none;
    animation: pulso 2.6s ease-in-out infinite;
  }
  .selo:focus-visible { box-shadow: 0 0 0 3px rgba(95,113,71,.55); }
  .selo:hover { animation-duration: 1.3s; }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 0 rgba(95,113,71,0); transform: scale(1); }
    50% { box-shadow: 0 0 0 10px rgba(95,113,71,.12); transform: scale(1.02); }
  }
  /* texto "clique para abrir" também abre */
  .selo-texto {
    position: absolute;
    left: 36%;
    top: 67.5%;
    width: 28%;
    height: 6%;
    border: 0;
    background: transparent;
    cursor: pointer;
  }
  #tela-envelope.abrindo .envelope { animation: abrir 1.1s ease forwards; }
  #tela-envelope.abrindo .selo { animation: none; transform: scale(1.12); transition: transform .35s ease; }
  @keyframes abrir {
    0% { transform: scale(1); opacity: 1; }
    30% { transform: scale(1.02); opacity: 1; }
    100% { transform: scale(1.18) translateY(-4%); opacity: 0; }
  }
  #tela-envelope.oculta { opacity: 0; visibility: hidden; pointer-events: none; }

  /* ---------- TELA 2: CONVITE ---------- */
  #tela-convite {
    opacity: 0;
    visibility: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #tela-convite.ativa { opacity: 1; visibility: visible; transition: opacity .9s ease; }
  .convite {
    max-width: 520px;
    min-height: 100%;
    margin: 0 auto;
    padding: 40px 28px 56px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .monograma {
    width: 46%;
    max-width: 190px;
    aspect-ratio: 460 / 545; /* recorte só da área do desenho dentro do PNG */
    background: url("__MONOGRAMA__") 61% 77% / 270% auto no-repeat;
    mix-blend-mode: multiply; /* some com o fundo branco do PNG */
    margin-bottom: 8px;
  }
  .frase {
    font-style: italic;
    font-size: 19px;
    line-height: 1.5;
    color: var(--texto);
    max-width: 380px;
    margin: 6px 0 22px;
  }
  .nomes {
    font-family: "Pinyon Script", "Cormorant Garamond", cursive;
    font-weight: 400;
    font-size: 58px;
    line-height: 1.05;
    color: var(--verde);
  }
  .nomes span { display: block; font-size: 38px; margin: 2px 0; }
  .convidam {
    text-transform: uppercase;
    letter-spacing: .22em;
    font-size: 13px;
    font-weight: 600;
    margin: 26px 0 18px;
    color: var(--verde-escuro);
  }
  .ramo {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--verde), transparent);
    margin: 6px auto 22px;
  }
  .data {
    display: flex;
    align-items: center;
    gap: 18px;
    color: var(--verde-escuro);
    margin-bottom: 20px;
  }
  .data .lado {
    text-transform: uppercase;
    letter-spacing: .2em;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 0;
    border-top: 1px solid var(--verde);
    border-bottom: 1px solid var(--verde);
    min-width: 92px;
  }
  .data .dia { font-size: 56px; line-height: 1; font-weight: 500; }
  .ano { letter-spacing: .3em; font-size: 16px; margin-bottom: 24px; }
  .local { font-size: 20px; line-height: 1.45; margin-bottom: 30px; }
  .local strong { font-weight: 600; display: block; font-size: 22px; color: var(--verde-escuro); }
  .botoes { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .botao {
    display: block;
    padding: 14px 20px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background .25s ease, color .25s ease;
  }
  .botao.cheio { background: var(--verde); color: #fff; border: 1px solid var(--verde); }
  .botao.cheio:hover { background: var(--verde-escuro); }
  .botao.linha { background: transparent; color: var(--verde); border: 1px solid var(--verde); }
  .botao.linha:hover { background: rgba(95,113,71,.08); }
  .voltar {
    margin-top: 28px;
    background: none;
    border: 0;
    font-family: inherit;
    font-style: italic;
    font-size: 16px;
    color: var(--verde);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  /* entrada escalonada do conteúdo */
  .convite > * { opacity: 0; transform: translateY(14px); }
  #tela-convite.ativa .convite > * {
    animation: surgir .9s ease forwards;
  }
  #tela-convite.ativa .convite > *:nth-child(1) { animation-delay: .35s; }
  #tela-convite.ativa .convite > *:nth-child(2) { animation-delay: .55s; }
  #tela-convite.ativa .convite > *:nth-child(3) { animation-delay: .75s; }
  #tela-convite.ativa .convite > *:nth-child(4) { animation-delay: .9s; }
  #tela-convite.ativa .convite > *:nth-child(5) { animation-delay: 1.0s; }
  #tela-convite.ativa .convite > *:nth-child(6) { animation-delay: 1.1s; }
  #tela-convite.ativa .convite > *:nth-child(7) { animation-delay: 1.2s; }
  #tela-convite.ativa .convite > *:nth-child(8) { animation-delay: 1.3s; }
  #tela-convite.ativa .convite > *:nth-child(9) { animation-delay: 1.4s; }
  #tela-convite.ativa .convite > *:nth-child(10) { animation-delay: 1.5s; }
  @keyframes surgir { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .selo { animation: none; }
    .convite > * { opacity: 1; transform: none; }
    #tela-convite.ativa .convite > * { animation: none; }
  }
</style>
</head>
<body>

  <!-- TELA 1: carta fechada -->
  <section id="tela-envelope" class="tela ativa papel" aria-label="Envelope do convite">
    <div class="envelope" role="img" aria-label="Envelope com o monograma A &amp; C e selo de cera verde">
      <button class="selo" type="button" aria-label="Clique para abrir o convite"></button>
      <button class="selo-texto" type="button" aria-label="Clique para abrir" tabindex="-1"></button>
    </div>
  </section>

  <!-- TELA 2: convite (edite os textos abaixo) -->
  <section id="tela-convite" class="tela papel" aria-label="Convite" aria-hidden="true">
    <main class="convite">
      <div class="monograma" role="img" aria-label="Monograma A &amp; C"></div>

      <p class="frase">“O amor é paciente, o amor é bondoso.”</p>

      <h1 class="nomes">Agatha <span>&amp;</span> Nome do Noivo</h1>

      <p class="convidam">convidam para a celebração do seu casamento</p>

      <div class="data">
        <div class="lado">Sábado</div>
        <div class="dia">00</div>
        <div class="lado">às 00h</div>
      </div>

      <p class="ano">MÊS · 2027</p>

      <div class="ramo"></div>

      <p class="local"><strong>Nome do Local</strong>Endereço completo<br>Cidade – UF</p>

      <div class="botoes">
        <a class="botao cheio" href="#" target="_blank" rel="noopener">Confirmar presença</a>
        <a class="botao linha" href="#" target="_blank" rel="noopener">Ver localização</a>
      </div>

      <button class="voltar" type="button">fechar o convite</button>
    </main>
  </section>

<script>
  (function () {
    var envelope = document.getElementById('tela-envelope');
    var convite = document.getElementById('tela-convite');
    var abrindo = false;

    function abrir() {
      if (abrindo) return;
      abrindo = true;
      envelope.classList.add('abrindo');
      setTimeout(function () {
        convite.classList.add('ativa');
        convite.setAttribute('aria-hidden', 'false');
        convite.scrollTop = 0;
      }, 650);
      setTimeout(function () {
        envelope.classList.remove('ativa');
        envelope.classList.add('oculta');
      }, 1100);
    }

    function fechar() {
      convite.classList.remove('ativa');
      convite.setAttribute('aria-hidden', 'true');
      envelope.classList.remove('abrindo', 'oculta');
      envelope.classList.add('ativa');
      abrindo = false;
    }

    document.querySelector('.selo').addEventListener('click', abrir);
    document.querySelector('.selo-texto').addEventListener('click', abrir);
    document.querySelector('.voltar').addEventListener('click', fechar);
  })();
</script>
</body>
</html>
